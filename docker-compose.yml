services:
  casa-tareas:
    build:
      context: .
      network: host
    container_name: casa-tareas
    restart: unless-stopped
    init: true
    ports:
      - "${APP_PORT:-3000}:8000"
    environment:
      APP_TIMEZONE: "${APP_TIMEZONE:-Europe/Zurich}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_POLL_SECONDS: "${TELEGRAM_POLL_SECONDS:-60}"
      ICAL_SYNC_MINUTES: "${ICAL_SYNC_MINUTES:-30}"
      MAX_ATTACHMENT_BYTES: "${MAX_ATTACHMENT_BYTES:-20971520}"
      GASTOS_COMIDA_URL: "${GASTOS_COMIDA_URL:-}"
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  gastos-comida:
    profiles: ["gastos"]
    build:
      context: ./gastos-comida
      network: host
    container_name: gastos-comida
    restart: unless-stopped
    init: true
    ports:
      - "${GASTOS_PORT:-8000}:8000"
    environment:
      GASTOS_REQUIRE_EXISTING_DB: "${GASTOS_REQUIRE_EXISTING_DB:-1}"
    volumes:
      - "${GASTOS_DATA_DIR:-./gastos-comida/data}:/app/data"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
