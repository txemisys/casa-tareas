<script>

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"})[c]})}
async function api(url,opt){var r;try{r=await fetch(url,Object.assign({headers:{"Content-Type":"application/json"}},opt||{}))}catch(e){throw new Error("No se pudo conectar con la API en "+url+". Comprueba que el servidor sigue arrancado y mira la terminal donde ejecutaste uvicorn.")}var raw=await r.text();var x={};if(raw){try{x=JSON.parse(raw)}catch(e){x={detail:raw}}}if(!r.ok)throw new Error(x.detail||("Error HTTP "+r.status));return x}
async function apiForm(url,form){var r;try{r=await fetch(url,{method:"POST",body:form})}catch(e){throw new Error("No se pudo subir el archivo.")}var raw=await r.text();var x={};if(raw){try{x=JSON.parse(raw)}catch(e){x={detail:raw}}}if(!r.ok)throw new Error(x.detail||("Error HTTP "+r.status));return x}
async function load(){state=await api("/api/state");render()}
function fmtDate(s){if(!s)return"";var d=new Date(s.length===10?s+"T12:00:00":s);return new Intl.DateTimeFormat("es",{day:"numeric",month:"short"}).format(d)}
function localDateValue(addDays){var d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+(addDays||0));return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())}
function dueText(t){if(t.paused||!t.next_due)return"";var a=new Date(t.next_due+"T12:00:00"),b=new Date();b.setHours(12,0,0,0);var n=Math.round((a-b)/86400000);if(n<0)return Math.abs(n)+" d pendiente";if(n===0)return"Hoy";if(n===1)return"Mañana";return"En "+n+" días"}
function tabs(){var h="",b="";views.forEach(function(v){h+='<button class="tab '+(view===v[0]?"active":"")+'" onclick="go(\''+v[0]+'\')">'+v[1]+"</button>";b+='<button class="'+(view===v[0]?"active":"")+'" onclick="go(\''+v[0]+'\')"><div>'+v[2]+"</div>"+v[1]+"</button>"});document.querySelector(".tabs").innerHTML=h;document.getElementById("bottom").innerHTML=b;updateUndoButton()}
function go(v){view=v;render()}
function updateUndoButton(){var b=document.getElementById("undoTop");if(!b)return;if(state.last_undo){b.classList.remove("hidden");b.textContent=window.matchMedia("(max-width:760px)").matches?"↶":"↶ Deshacer"}else b.classList.add("hidden")}
function showUndo(message,undoId){var t=document.getElementById("toast");if(!t)return;if(toastTimer)clearTimeout(toastTimer);t.innerHTML='<span>'+esc(message)+'</span>'+(undoId?'<button onclick="undoById('+undoId+')">Deshacer</button>':'');t.classList.remove("hidden");toastTimer=setTimeout(function(){t.classList.add("hidden")},12000)}
async function undoById(id){try{var r=await api("/api/undo/"+id,{method:"POST"});await load();showUndo("Deshecho: "+(r.undone||"último cambio"),null)}catch(e){alert(e.message)}}
async function undoLatest(){if(state.last_undo)await undoById(state.last_undo.id)}
function render(){tabs();if(view==="board")renderBoard();if(view==="tasks")renderTasks();if(view==="events")renderEvents();if(view==="areas")renderAreas();if(view==="people")renderPeople();if(view==="history")renderHistory();renderDueAlerts();notifyBrowserAlerts()}
function pad2(n){return String(n).padStart(2,"0")}
function datetimeLocalValue(value){var d=value?new Date(value):new Date(Date.now()+86400000);if(!value)d.setMinutes(0,0,0);return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())+"T"+pad2(d.getHours())+":"+pad2(d.getMinutes())}
function fmtEventDate(value){var d=new Date(value);return new Intl.DateTimeFormat("es",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}).format(d)}
function reminderLabel(minutes){if(minutes===0)return"A la hora";if(minutes<60)return minutes+" min antes";if(minutes%1440===0)return(minutes/1440)+" d antes";if(minutes%60===0)return(minutes/60)+" h antes";return minutes+" min antes"}
function eventCard(e,compact){var area=e.area?'<span class="pill">'+esc(e.area.icon||"⌂")+" "+esc(e.area.name)+'</span>':"";var reminders=(e.reminders||[]).map(function(m){return'<span class="pill">🔔 '+esc(reminderLabel(m))+'</span>'}).join("");var actions=compact?"":'<div class="actions"><button class="ghost" onclick="openEvent('+e.id+')">Editar</button><button class="danger" onclick="deleteEvent('+e.id+')">Eliminar</button></div>';return'<div class="event-card '+(compact?"compact":"")+'"><div class="icon">📅</div><div><div class="title">'+esc(e.title)+'</div><div class="event-time">'+esc(fmtEventDate(e.event_at))+'</div><div class="desc">'+esc(e.description||"")+'</div><div class="meta">'+area+reminders+'</div></div>'+actions+'</div>'}
function renderDueAlerts(){var main=document.getElementById("main");if(!main||!state.alerts_due||!state.alerts_due.length)return;var h='<div class="alert-panel"><strong>🔔 Avisos pendientes</strong>'+state.alerts_due.map(function(a){var area=a.area?esc(a.area.name)+" · ":"";return'<div class="alert-row"><div class="alert-main"><span>📅</span><div><strong>'+esc(a.title)+'</strong><div class="muted">'+area+esc(fmtEventDate(a.event_at))+' · '+esc(reminderLabel(a.reminder_minutes))+'</div></div></div><div class="alert-actions"><button class="secondary" onclick="ackEventReminder('+a.event_id+','+a.reminder_minutes+')">Visto</button></div></div>'}).join("")+'</div>';main.insertAdjacentHTML("afterbegin",h)}
async function ackEventReminder(eventId,minutes){try{await api("/api/events/"+eventId+"/reminders/"+minutes+"/ack",{method:"POST"});await load()}catch(e){alert(e.message)}}
function notifyBrowserAlerts(){if(!state.alerts_due||!state.alerts_due.length||!("Notification" in window)||Notification.permission!=="granted")return;state.alerts_due.forEach(function(a){var key=a.event_id+":"+a.reminder_minutes;if(browserNotified[key])return;browserNotified[key]=true;try{new Notification("Casa Tareas · "+a.title,{body:(a.area?a.area.name+" · ":"")+fmtEventDate(a.event_at)})}catch(e){}})}
async function requestBrowserNotifications(){if(!("Notification" in window)){alert("Este navegador no admite notificaciones.");return}if(!window.isSecureContext){alert("Las notificaciones del navegador requieren HTTPS o abrir la app desde localhost. Los avisos dentro de Casa Tareas seguirán funcionando.");return}var result=await Notification.requestPermission();if(result==="granted"){notifyBrowserAlerts();alert("Avisos del navegador activados mientras Casa Tareas esté abierta.")}else alert("No se concedió permiso para notificaciones.")}
function durationLabel(minutes){if(!minutes)return"";if(minutes<60)return minutes+" min";if(minutes%60===0)return(minutes/60)+" h";return Math.floor(minutes/60)+" h "+(minutes%60)+" min"}
function needClass(score){if(score>=100)return"need-due";if(score>=70)return"need-good";if(score>=40)return"need-soon";return"need-soft"}
function needMeter(t){if(t.need_score==null)return"";var shown=Math.min(100,Math.max(0,t.need_score));return '<div class="need-row '+needClass(t.need_score)+'"><div class="need-track"><div class="need-fill" style="width:'+shown+'%"></div></div><span class="need-label">'+esc(t.need_label)+' · '+t.need_score+'%</span></div>'}
function suggestionCard(t){var area=t.area?esc(t.area.icon||"⌂")+" "+esc(t.area.name):"Sin área";var duration=t.estimated_minutes?"⏱ "+durationLabel(t.estimated_minutes):"⏱ Sin estimar";return '<div class="suggestion-card"><div class="suggestion-top"><div class="icon">'+esc(t.icon)+'</div><div><div class="title">'+esc(t.title)+'</div><div class="muted">'+area+' · '+duration+'</div></div></div>'+needMeter(t)+'<div class="actions"><button class="secondary" onclick="addToday('+t.id+')">+ Hoy</button><button class="ghost" onclick="editTask('+t.id+')">Editar</button></div></div>'}
function filteredSuggestions(){var list=state.suggested||[];if(suggestMinutes==null)return list;return list.filter(function(t){return t.estimated_minutes!=null&&t.estimated_minutes<=suggestMinutes})}
function setSuggestMinutes(value){suggestMinutes=value;renderBoard()}
function suggestionsPanel(){var list=filteredSuggestions();var h='<section class="suggestions-panel"><div class="suggestions-head"><div><div class="suggestions-title">✨ Sugeridas ahora</div><div class="suggestions-help">Tareas recurrentes cerca de su ciclo. Nada entra en Hoy automáticamente.</div></div><div class="suggest-filter"><button class="'+(suggestMinutes==null?"active":"")+'" onclick="setSuggestMinutes(null)">Todas</button><button class="'+(suggestMinutes===10?"active":"")+'" onclick="setSuggestMinutes(10)">≤10 min</button><button class="'+(suggestMinutes===20?"active":"")+'" onclick="setSuggestMinutes(20)">≤20 min</button><button class="'+(suggestMinutes===30?"active":"")+'" onclick="setSuggestMinutes(30)">≤30 min</button><button class="'+(suggestMinutes===60?"active":"")+'" onclick="setSuggestMinutes(60)">≤1 h</button></div></div><div class="suggestions-strip">'+(list.length?list.map(suggestionCard).join(""):'<div class="empty">'+(suggestMinutes==null?"No hay tareas que necesiten atención ahora.":"No hay sugerencias que quepan en ese tiempo con duración estimada.")+'</div>')+'</div></section>';return h}
function taskSupplyPicker(t){var selected={};(t&&t.supplies||[]).forEach(function(i){selected[i.id]=true});if(!(state.inventory||[]).length)return'<div class="muted">No hay productos en Inventario. Puedes crearlos desde Tareas → Inventario y Comprar.</div>';return'<div class="supply-picker">'+state.inventory.map(function(i){return'<label class="supply-choice"><input type="checkbox" name="supply_id" value="'+i.id+'" '+(selected[i.id]?"checked":"")+'> <span>'+esc(i.name)+' <span class="muted">· '+esc(stockLabel(i.stock_status))+'</span></span></label>'}).join("")+'</div>'}
function fileSizeLabel(bytes){if(bytes<1024)return bytes+" B";if(bytes<1024*1024)return Math.round(bytes/1024)+" KB";return(bytes/(1024*1024)).toFixed(1)+" MB"}
function documentsBox(entityType,item){if(!item||!item.id)return"";var docs=item.attachments||[];var inputId="attach-"+entityType+"-"+item.id;return'<div class="document-box"><div><strong>📎 Documentos</strong><div class="muted">PDF, imágenes, facturas, garantías, contratos o manuales. Máximo 20 MB por archivo.</div></div><div class="document-list">'+(docs.length?docs.map(function(d){return'<div class="document-row"><div><a href="/api/attachments/'+d.id+'/download">'+esc(d.original_name)+'</a><div class="muted">'+esc(fileSizeLabel(d.size_bytes))+'</div></div><button class="danger" type="button" onclick="deleteAttachment('+d.id+',\''+entityType+'\','+item.id+')">Eliminar</button></div>'}).join(""):'<div class="muted">Sin documentos adjuntos.</div>')+'</div><div class="actions"><input id="'+inputId+'" type="file"><button class="secondary" type="button" onclick="uploadAttachment(\''+entityType+'\','+item.id+',\''+inputId+'\')">Subir documento</button></div></div>'}
async function uploadAttachment(entityType,id,inputId){var input=document.getElementById(inputId);if(!input||!input.files||!input.files[0]){alert("Selecciona primero un archivo.");return}var form=new FormData();form.append("entity_type",entityType);form.append("entity_id",String(id));form.append("file",input.files[0]);try{await apiForm("/api/attachments",form);await load();if(entityType==="task")openTask(id);else openArea(id)}catch(e){alert(e.message)}}
async function deleteAttachment(attachmentId,entityType,entityId){if(!confirm("¿Eliminar este documento?"))return;try{await api("/api/attachments/"+attachmentId,{method:"DELETE"});await load();if(entityType==="task")openTask(entityId);else openArea(entityId)}catch(e){alert(e.message)}}
function taskMeta(t){var m='<span class="pill">'+esc(t.category)+'</span>';m+='<span class="pill">'+(t.task_type==="management"?"🧠 Gestión":"🧹 Ejecución")+'</span>';if(t.estimated_minutes)m+='<span class="pill">⏱ '+esc(durationLabel(t.estimated_minutes))+'</span>';if(t.need_label)m+='<span class="pill">'+esc(t.need_label)+' · '+t.need_score+'%</span>';if(t.paused&&t.pause)m+='<span class="pill pause-tag">🌴 Pausada hasta '+esc(fmtDate(t.pause.return_date))+'</span>';if(t.area)m+='<span class="pill">'+esc(t.area.icon||"⌂")+' '+esc(t.area.name)+'</span>';if(t.effective_owner)m+='<span class="pill owner-pill">'+esc(t.effective_owner.icon||"👤")+' Responsable: '+esc(t.effective_owner.name)+'</span>';if((t.supplies||[]).length)m+='<span class="pill">🧴 '+t.supplies.length+' productos</span>';if((t.missing_supplies||[]).length)m+='<span class="pill supply-missing">Falta: '+esc(t.missing_supplies.map(function(x){return x.name}).join(", "))+'</span>';if(t.attachment_count)m+='<span class="pill">📎 '+t.attachment_count+'</span>';return m}
function taskDoneDefinition(t){return t.definition_of_done?'<div class="done-definition"><strong>Se considera terminada cuando:</strong> '+esc(t.definition_of_done)+'</div>':""}
function card(t,mode){var due=dueText(t);var buttons="";
if(mode==="today")buttons='<button class="ghost" onclick="postpone('+t.id+')">Posponer</button><button class="secondary" onclick="completeTask('+t.id+')">✓ Hecha</button>';
if(mode==="upcoming")buttons='<button class="secondary" onclick="addToday('+t.id+')">+ Hoy</button><button class="ghost" onclick="editTask('+t.id+')">Editar</button>';
if(mode==="tasks"){buttons='<button class="ghost" onclick="editTask('+t.id+')">Editar</button>';if(t.active){if(t.pause&&t.pause.source==="task")buttons+='<button class="secondary" onclick="resumeTask('+t.id+')">Reanudar</button>';else if(!t.paused)buttons+='<button class="ghost" onclick="openPause(\'task\','+t.id+')">🌴 Pausar</button>';buttons+='<button class="ghost" onclick="archiveTask('+t.id+')">Archivar</button>'}buttons+='<button class="danger" onclick="deleteTask('+t.id+')">Eliminar</button>'}
return '<article class="card" style="--c:'+esc(t.color)+'" '+(mode==="today"&&!t.paused?'draggable="true" data-id="'+t.id+'"':'')+'><div class="icon">'+esc(t.icon)+'</div><div><div class="title">'+esc(t.title)+'</div><div class="desc">'+esc(t.description)+'</div><div class="meta">'+taskMeta(t)+(due?'<span class="pill '+(due.indexOf("pendiente")>0?"overdue":"")+'">'+esc(due)+'</span>':"")+'</div>'+(mode==="tasks"?(needMeter(t)+taskDoneDefinition(t)):"")+'</div><div class="actions">'+buttons+"</div></article>"}
function boardCard(t,origin){var due=dueText(t);var buttons="";if(t.paused)buttons='<button class="ghost" onclick="editTask('+t.id+')">Editar</button>';else if(origin==="today")buttons='<button class="ghost" onclick="postpone('+t.id+')">Posponer</button><button class="secondary" onclick="completeTask('+t.id+')">✓ Hecha</button>';else if(origin==="all")buttons='<button class="secondary" onclick="addToday('+t.id+')">+ Hoy</button><button class="ghost" onclick="editTask('+t.id+')">Editar</button>';else buttons='<button class="secondary" onclick="addToday('+t.id+')">+ Hoy</button>';var dragAttr=origin==="all"||t.paused?'':' draggable="true" data-id="'+t.id+'" data-origin="'+origin+'"';return '<article class="card" style="--c:'+esc(t.color)+'"'+dragAttr+'><div class="icon">'+esc(t.icon)+'</div><div><div class="title">'+esc(t.title)+'</div><div class="desc">'+esc(t.description)+'</div><div class="meta">'+taskMeta(t)+(due?'<span class="pill '+(due.indexOf("pendiente")>0?"overdue":"")+'">'+esc(due)+'</span>':"")+'</div></div><div class="actions">'+buttons+'</div></article>'}

function activityIcon(kind){if(kind.indexOf("completed")>=0)return"✓";if(kind.indexOf("calendar")>=0||kind.indexOf("event")>=0)return"📅";if(kind.indexOf("inventory")>=0)return"🧴";if(kind.indexOf("attachment")>=0)return"📎";if(kind.indexOf("area")>=0)return"⌂";return"•"}
function activitySeenAt(){try{return localStorage.getItem("casa_activity_seen_at")}catch(e){return null}}
function markActivitySeen(){var newest=(state.activity&&state.activity[0])?state.activity[0].created_at:new Date().toISOString();try{localStorage.setItem("casa_activity_seen_at",newest)}catch(e){}if(view==="board")renderBoard()}
function activityPanel(){var all=state.activity||[];if(!all.length)return"";var seen=activitySeenAt();var cutoff=seen?new Date(seen):new Date(Date.now()-86400000);var items=all.filter(function(x){return new Date(x.created_at)>cutoff}).slice(0,8);if(!items.length)return"";var title=seen?"Desde tu última visita":"Actividad reciente";return'<section class="activity-panel"><div class="activity-head"><div><div class="suggestions-title">📰 '+title+'</div><div class="suggestions-help">Cambios realizados desde este navegador.</div></div><button class="ghost" onclick="markActivitySeen()">Marcar como visto</button></div><div class="activity-list">'+items.map(function(x){return'<div class="activity-item"><span>'+activityIcon(x.kind)+'</span><div><strong>'+esc(x.summary)+'</strong>'+(x.detail?'<div class="muted">'+esc(x.detail)+'</div>':'')+'<div class="activity-time">'+esc(new Date(x.created_at).toLocaleString("es"))+'</div></div></div>'}).join("")+'</div></section>'}
function resumeModeLabel(mode){return mode==="keep_calendar"?"Mantener calendario":"Continuar ciclo"}
function vacationPanel(){var v=state.vacation||{};if(v.active){var names=(v.excluded_area_ids||[]).map(function(id){var a=state.areas.find(function(x){return x.id===id});return a?a.name:null}).filter(Boolean);var excluded=names.length?"Siguen activas: "+names.join(", "):"Todas las áreas de tareas están pausadas";return '<section class="vacation-panel active"><div class="vacation-head"><div><div class="vacation-title">🌴 Modo vacaciones activo</div><div class="vacation-meta">Regreso: <strong>'+esc(fmtDate(v.return_date))+'</strong> · '+esc(resumeModeLabel(v.resume_mode))+'<br>'+esc(excluded)+' · La Agenda y sus avisos siguen activos.</div></div><span class="status">Pausado</span></div><div class="vacation-actions"><button class="secondary" onclick="endVacation()">Terminar vacaciones ahora</button></div></section>'}return '<section class="vacation-panel"><div class="vacation-head"><div><div class="vacation-title">🌴 Modo vacaciones</div><div class="vacation-meta">Pausa temporalmente las tareas sin ocultar reuniones, citas ni vencimientos de la Agenda.</div></div><button class="primary" onclick="openVacation()">Activar</button></div></section>'}
function openVacation(){var choices=state.areas.map(function(a){return '<label class="reminder-option"><input type="checkbox" name="vacation_excluded" value="'+a.id+'"> '+esc(a.icon)+' '+esc(a.name)+'</label>'}).join("");var html='<div class="modalhead"><div><h2>🌴 Modo vacaciones</h2><div class="muted">Las tareas se ocultan de Hoy, Próximamente y Sugeridas. La Agenda continúa funcionando.</div></div><button class="ghost" onclick="closeModal()">×</button></div><form id="vacationform" class="formgrid"><div class="field"><label>Fecha de regreso</label><input name="return_date" type="date" min="'+localDateValue(1)+'" value="'+localDateValue(7)+'" required></div><div class="field"><label>Al volver</label><select name="resume_mode"><option value="continue_cycle">Continuar ciclo · vacaciones no cuentan</option><option value="keep_calendar">Mantener calendario original</option></select></div><div class="field full"><label>Áreas que deben seguir activas</label><div class="reminders">'+(choices||'<span class="muted">No hay áreas activas.</span>')+'</div><div class="muted">Útil para pisos en alquiler, Krankenkassen u otros asuntos que deban seguir visibles.</div></div></form><div class="modalfoot"><button class="ghost" onclick="closeModal()">Cancelar</button><button class="primary" onclick="startVacation()">Activar vacaciones</button></div>';showModal(html)}
async function startVacation(){var f=new FormData(document.getElementById("vacationform"));var o={return_date:String(f.get("return_date")||""),resume_mode:String(f.get("resume_mode")||"continue_cycle"),excluded_area_ids:f.getAll("vacation_excluded").map(Number)};try{await api("/api/vacation/start",{method:"POST",body:JSON.stringify(o)});closeModal();await load()}catch(e){alert(e.message)}}
async function endVacation(){var v=state.vacation||{};var extra=v.resume_mode==="continue_cycle"?" Las fechas se desplazarán solo por los días que habéis estado en vacaciones.":"";if(!confirm("¿Terminar el modo vacaciones ahora?"+extra))return;try{await api("/api/vacation/end",{method:"POST"});await load()}catch(e){alert(e.message)}}
function openPause(kind,id){var item=kind==="task"?state.tasks.find(function(x){return x.id===id}):(state.areas_all||[]).find(function(x){return x.id===id});if(!item)return;var noun=kind==="task"?"tarea":"área";var html='<div class="modalhead"><div><h2>🌴 Pausar '+noun+'</h2><div class="muted">'+esc(item.title||item.name)+'</div></div><button class="ghost" onclick="closeModal()">×</button></div><form id="pauseform" class="formgrid"><div class="field"><label>Reanudar el</label><input name="return_date" type="date" min="'+localDateValue(1)+'" value="'+localDateValue(7)+'" required></div><div class="field"><label>Al reanudar</label><select name="resume_mode"><option value="continue_cycle">Continuar ciclo · pausa no cuenta</option><option value="keep_calendar">Mantener calendario original</option></select></div></form><div class="modalfoot"><button class="ghost" onclick="closeModal()">Cancelar</button><button class="primary" onclick="doPause(\''+kind+'\','+id+')">Pausar</button></div>';showModal(html)}
async function doPause(kind,id){var f=new FormData(document.getElementById("pauseform"));var o={return_date:String(f.get("return_date")||""),resume_mode:String(f.get("resume_mode")||"continue_cycle")};try{await api("/api/"+(kind==="task"?"tasks":"areas")+"/"+id+"/pause",{method:"POST",body:JSON.stringify(o)});closeModal();await load()}catch(e){alert(e.message)}}
async function resumeTask(id){try{await api("/api/tasks/"+id+"/resume",{method:"POST"});await load()}catch(e){alert(e.message)}}
async function resumeArea(id){try{await api("/api/areas/"+id+"/resume",{method:"POST"});await load()}catch(e){alert(e.message)}}
function renderBoard(){var recent=state.history.slice(0,8);var all=state.tasks.filter(function(t){return t.active});var upcomingEvents=state.event_upcoming||[];var todayEvents=state.event_today||[];var h='<div class="pagehead"><div><h1>Tablero</h1><div class="subtitle">Tareas y agenda doméstica en un mismo vistazo.</div></div><button class="primary" onclick="openTask()">+ Nueva tarea</button></div>'+activityPanel()+vacationPanel()+suggestionsPanel()+'<div class="mobile-board-nav"><button aria-label="Columna anterior" onclick="moveBoard(-1)">←</button><div class="mobile-board-meta"><strong id="mobileBoardLabel">Hoy</strong><span id="mobileBoardPos">3 / 4</span></div><button aria-label="Columna siguiente" onclick="moveBoard(1)">→</button></div><div class="kanban" id="kanbanBoard">';
h+='<section class="kanban-col" id="col-all" data-drop="all"><div class="kanban-head"><div><div class="kanban-title">Todas las tareas</div><div class="drag-hint">Catálogo activo · usa + Hoy para añadir</div></div><span class="kanban-count">'+all.length+'</span></div><div class="kanban-list">'+(all.length?all.map(function(t){return boardCard(t,"all")}).join(""):'<div class="kanban-empty">No hay tareas activas.</div>')+'</div></section>';
h+='<section class="kanban-col" id="col-upcoming" data-drop="upcoming"><div class="kanban-head"><div><div class="kanban-title">Próximamente</div><div class="drag-hint">Eventos y tareas por venir</div></div><span class="kanban-count">'+(state.upcoming.length+upcomingEvents.length)+'</span></div><div class="kanban-list">'+upcomingEvents.map(function(e){return eventCard(e,true)}).join("")+(state.upcoming.length?state.upcoming.map(function(t){return boardCard(t,"upcoming")}).join(""):(upcomingEvents.length?"":'<div class="kanban-empty">No hay nada próximo.</div>'))+'</div></section>';
h+='<section class="kanban-col" id="col-today" data-drop="today"><div class="kanban-head"><div><div class="kanban-title">Hoy</div><div class="drag-hint">Eventos de hoy y cola de tareas</div></div><span class="kanban-count">'+(state.today.length+todayEvents.length)+'</span></div><div class="kanban-list">'+todayEvents.map(function(e){return eventCard(e,true)}).join("")+(state.today.length?state.today.map(function(t){return boardCard(t,"today")}).join(""):(todayEvents.length?"":'<div class="kanban-empty">🎉 Nada pendiente para hoy.</div>'))+'</div></section>';
h+='<section class="kanban-col" id="col-done" data-drop="done"><div class="kanban-head"><div><div class="kanban-title">Realizadas</div><div class="drag-hint">Últimas tareas completadas</div></div><span class="kanban-count">'+recent.length+'</span></div><div class="kanban-list">'+(recent.length?recent.map(function(x){return '<div class="done-card"><div class="icon">'+esc(x.icon)+'</div><div><div class="title">'+esc(x.title)+'</div><div class="muted">'+new Date(x.completed_at).toLocaleString("es")+' · '+esc(x.name)+'</div></div><div class="avatar" style="background:'+esc(x.color)+'">'+esc(x.person_icon)+'</div></div>'}).join(""):'<div class="kanban-empty">Aún no hay tareas realizadas.</div>')+'</div></section></div>';

function bindAreaDrag(){var mobile=window.matchMedia("(max-width:760px)").matches;document.querySelectorAll(".area-task[draggable=true]").forEach(function(el){if(mobile){el.setAttribute("draggable","false");return}el.addEventListener("dragstart",function(e){areaDraggedTask={id:Number(el.dataset.areaTaskId),current:el.dataset.currentArea===""?null:Number(el.dataset.currentArea)};el.style.opacity=".45";if(e.dataTransfer){e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain",String(areaDraggedTask.id))}});el.addEventListener("dragend",function(){el.style.opacity="";areaDraggedTask=null;document.querySelectorAll(".area-drop").forEach(function(x){x.classList.remove("hot")})})});document.querySelectorAll(".area-drop").forEach(function(zone){zone.addEventListener("dragover",function(e){if(!areaDraggedTask||zone.dataset.areaActive!=="1")return;var target=zone.dataset.areaId===""?null:Number(zone.dataset.areaId);if(target===areaDraggedTask.current)return;e.preventDefault();zone.classList.add("hot")});zone.addEventListener("dragleave",function(e){if(!zone.contains(e.relatedTarget))zone.classList.remove("hot")});zone.addEventListener("drop",async function(e){if(!areaDraggedTask||zone.dataset.areaActive!=="1")return;var target=zone.dataset.areaId===""?null:Number(zone.dataset.areaId);if(target===areaDraggedTask.current)return;e.preventDefault();e.stopPropagation();zone.classList.remove("hot");var taskId=areaDraggedTask.id;areaDraggedTask=null;await moveTaskArea(taskId,target)})})}
function openPerson(id){var list=state.people_all&&state.people_all.length?state.people_all:state.people;var p=id?list.find(function(x){return x.id===id}):null;var html='<div class="modalhead"><div><h2>'+(p?"Editar persona":"Nueva persona")+'</h2><div class="muted">Nombre, icono y color para identificarla.</div></div><button class="ghost" onclick="closeModal()">×</button></div><form id="personform" class="formgrid"><div class="field full"><label>Nombre</label><input name="name" required maxlength="50" value="'+esc(p?p.name:"")+'"></div><div class="field"><label>Icono</label><input name="icon" value="'+esc(p?p.icon:"👤")+'"></div><div class="field"><label>Color</label><input name="color" type="color" value="'+esc(p?p.color:"#f7c8b6")+'"></div></form><div class="modalfoot"><button class="ghost" onclick="closeModal()">Cancelar</button><button class="primary" onclick="savePerson('+(p?p.id:"null")+')">Guardar</button></div>';showModal(html)}
async function savePerson(id){var f=new FormData(document.getElementById("personform"));var o=Object.fromEntries(f.entries());try{await api(id?"/api/people/"+id:"/api/people",{method:id?"PUT":"POST",body:JSON.stringify(o)});closeModal();await load()}catch(e){alert(e.message)}}
async function deletePerson(id){var list=state.people_all&&state.people_all.length?state.people_all:state.people;var p=list.find(function(x){return x.id===id});if(!confirm('¿Eliminar a "'+(p?p.name:"esta persona")+'"?\n\nSu historial anterior se conservará, pero ya no aparecerá al completar tareas.'))return;try{var r=await api("/api/people/"+id,{method:"DELETE"});await load();showUndo("Persona eliminada",r.undo_id)}catch(e){alert(e.message)}}
async function restorePerson(id){try{var r=await api("/api/people/"+id+"/restore",{method:"POST"});await load();showUndo("Persona restaurada",r.undo_id)}catch(e){alert(e.message)}}
async function detectTelegramChats(){try{var r=await api("/api/telegram/chats",{method:"POST"});var chats=r.chats||[];var html='<div class="modalhead"><div><h2>Elegir chat de Telegram</h2><div class="muted">Si no aparece el grupo, envía /casa en él, espera unos segundos y vuelve a detectar.</div></div><button class="ghost" onclick="closeModal()">×</button></div>';if(!chats.length){html+='<div class="empty">No se han encontrado chats recientes.<br><br>Añade el bot al grupo, envía <strong>/casa</strong> y prueba de nuevo.</div><div class="modalfoot"><button class="primary" onclick="detectTelegramChats()">Volver a detectar</button></div>'}else{html+='<div>'+chats.map(function(ch){return'<div class="chat-choice"><div><strong>'+esc(ch.title)+'</strong><div class="chat-type">'+esc(ch.type)+' · '+esc(ch.chat_id)+'</div></div><button class="secondary" onclick="connectTelegramChat('+ch.chat_id+')">Usar este chat</button></div>'}).join("")+'</div>'}showModal(html)}catch(e){alert(e.message)}}
async function connectTelegramChat(chatId){try{await api("/api/telegram/chat",{method:"PUT",body:JSON.stringify({chat_id:chatId,title:""})});closeModal();await load();showUndo("Telegram conectado",null)}catch(e){alert(e.message)}}
async function testTelegram(){try{await api("/api/telegram/test",{method:"POST"});showUndo("Mensaje de prueba enviado a Telegram",null)}catch(e){alert(e.message)}}
async function disconnectTelegram(){if(!confirm("¿Desconectar el chat de Telegram? Los eventos y recordatorios se conservarán."))return;try{await api("/api/telegram/chat",{method:"DELETE"});await load()}catch(e){alert(e.message)}}
var reminderPresets=[[10080,"7 días antes"],[1440,"1 día antes"],[120,"2 horas antes"],[60,"1 hora antes"],[30,"30 min antes"],[0,"A la hora"]];
function reminderOptions(selected){selected=selected||[1440];return reminderPresets.map(function(r){return'<label class="reminder-option"><input type="checkbox" name="reminder" value="'+r[0]+'" '+(selected.indexOf(r[0])>=0?"checked":"")+'> '+esc(r[1])+'</label>'}).join("")}
function openEvent(id){var e=id?(state.events||[]).find(function(x){return x.id===id}):null;var dt=e?datetimeLocalValue(e.event_at):datetimeLocalValue(null);var html='<div class="modalhead"><div><h2>'+(e?"Editar evento":"Nuevo evento")+'</h2><div class="muted">Para reuniones, citas, vencimientos y otras fechas concretas.</div></div><button class="ghost" onclick="closeModal()">×</button></div><form id="eventform" class="formgrid"><div class="field full"><label>Título</label><input name="title" required maxlength="160" value="'+esc(e?e.title:"")+'"></div><div class="field"><label>Área</label><select name="area_id">'+activeAreaOptions(e&&e.area_id?e.area_id:null)+'</select></div><div class="field"><label>Fecha y hora</label><input name="event_at" type="datetime-local" required value="'+esc(dt)+'"></div><div class="field full"><label>Notas</label><textarea name="description" placeholder="Documentación que llevar, dirección, temas a tratar…">'+esc(e?e.description:"")+'</textarea></div><div class="field full"><label>Avisarme</label><div class="reminders">'+reminderOptions(e?e.reminders:[1440])+'</div></div></form><div class="modalfoot"><button class="ghost" onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveEvent('+(e?e.id:"null")+')">Guardar</button></div>';showModal(html)}
async function saveEvent(id){var f=new FormData(document.getElementById("eventform"));var o={title:String(f.get("title")||""),description:String(f.get("description")||""),area_id:f.get("area_id")?Number(f.get("area_id")):null,event_at:String(f.get("event_at")||""),reminders:f.getAll("reminder").map(Number)};try{await api(id?"/api/events/"+id:"/api/events",{method:id?"PUT":"POST",body:JSON.stringify(o)});closeModal();view="events";await load()}catch(e){alert(e.message)}}
async function deleteEvent(id){var e=(state.events||[]).find(function(x){return x.id===id});if(!confirm('Eliminar el evento "'+(e?e.title:"")+'"?'))return;try{await api("/api/events/"+id,{method:"DELETE"});await load()}catch(err){alert(err.message)}}
function taskCategoryOptions(){var values=["General","Vacaciones-Viajes"];(state.tasks||[]).forEach(function(t){if(t.category&&values.indexOf(t.category)<0)values.push(t.category)});return values.sort(function(a,b){return a.localeCompare(b,"es")}).map(function(x){return '<option value="'+esc(x)+'"></option>'}).join("")}
function openTask(id){var t=id?state.tasks.find(function(x){return x.id===id}):null;var due=t&&t.initial_due_date?t.initial_due_date:new Date().toISOString().slice(0,10);var html='<div class="modalhead"><div><h2>'+(t?"Editar tarea":"Nueva tarea")+'</h2><div class="muted">La responsabilidad puede heredarse del área o sobrescribirse para esta tarea.</div></div><button class="ghost" onclick="closeModal()">×</button></div><form id="taskform" class="formgrid"><div class="field full"><label>Título</label><input name="title" required value="'+esc(t?t.title:"")+'"></div><div class="field full"><label>Descripción</label><textarea name="description">'+esc(t?t.description:"")+'</textarea></div><div class="field"><label>Categoría</label><input name="category" list="taskCategoryList" value="'+esc(t?t.category:"General")+'"><datalist id="taskCategoryList">'+taskCategoryOptions()+'</datalist></div><div class="field"><label>Área de responsabilidad</label><select name="area_id">'+activeAreaOptions(t&&t.area_id?t.area_id:null)+'</select></div><div class="field"><label>Tipo de trabajo</label><select name="task_type"><option value="execution">🧹 Ejecución</option><option value="management">🧠 Gestión / carga mental</option></select></div><div class="field"><label>Duración estimada</label><select name="estimated_minutes"><option value="">Sin estimar</option><option value="5">5 min</option><option value="10">10 min</option><option value="20">20 min</option><option value="30">30 min</option><option value="60">1 h</option><option value="90">1 h 30 min</option><option value="120">2 h</option></select></div><div class="field"><label>Responsable de esta tarea</label><select name="owner_person_id">'+activePeopleOptions(t&&t.owner_person_id?t.owner_person_id:null,"Heredar del área")+'</select></div><div class="field full"><label>Productos necesarios</label>'+taskSupplyPicker(t)+'</div><div class="field full"><label>Se considera terminada cuando…</label><textarea name="definition_of_done" placeholder="Ej. encimera y fregadero limpios, basura revisada y productos guardados">'+esc(t?t.definition_of_done:"")+'</textarea></div><div class="field full"><label>Notas de responsabilidad</label><textarea name="responsibility_notes" placeholder="Ej. incluye comprobar consumibles y decidir cuándo hacerlo">'+esc(t?t.responsibility_notes:"")+'</textarea></div><div class="field"><label>Icono</label><input name="icon" value="'+esc(t?t.icon:"🧹")+'"></div><div class="field"><label>Color</label><input name="color" type="color" value="'+esc(t?t.color:"#dcecff")+'"></div><div class="field"><label>Recurrencia</label><select name="recurrence_type"><option value="none">Puntual</option><option value="cycle">Cada X días desde última vez</option><option value="fixed">Calendario fijo</option></select></div><div class="field"><label>Cada X días</label><input name="frequency_days" type="number" min="1" value="'+esc(t&&t.frequency_days?t.frequency_days:"7")+'"></div><div class="field"><label>Primera / próxima fecha</label><input name="initial_due_date" type="date" value="'+esc(due)+'"></div><div class="field"><label>Fecha de anclaje</label><input name="anchor_date" type="date" value="'+esc(t&&t.anchor_date?t.anchor_date:due)+'"></div></form>'+documentsBox("task",t)+'<div class="modalfoot"><button class="ghost" onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveTask('+(t?t.id:"null")+')">Guardar</button></div>';showModal(html);document.querySelector('[name="recurrence_type"]').value=t?t.recurrence_type:"cycle";document.querySelector('[name="task_type"]').value=t&&t.task_type?t.task_type:"execution";document.querySelector('[name="estimated_minutes"]').value=t&&t.estimated_minutes?String(t.estimated_minutes):""}

function editTask(id){openTask(id)}
async function saveTask(id){var f=new FormData(document.getElementById("taskform"));var o=Object.fromEntries(f.entries());o.frequency_days=o.recurrence_type==="none"?null:Number(o.frequency_days||7);o.area_id=o.area_id?Number(o.area_id):null;o.owner_person_id=o.owner_person_id?Number(o.owner_person_id):null;o.estimated_minutes=o.estimated_minutes?Number(o.estimated_minutes):null;o.supply_ids=f.getAll("supply_id").map(Number);try{await api(id?"/api/tasks/"+id:"/api/tasks",{method:id?"PUT":"POST",body:JSON.stringify(o)});closeModal();await load()}catch(e){alert(e.message)}}
async function archiveTask(id){if(!confirm("¿Archivar esta tarea? El historial se conservará."))return;try{var r=await api("/api/tasks/"+id,{method:"DELETE"});await load();showUndo("Tarea archivada",r.undo_id)}catch(e){alert(e.message)}}
async function deleteTask(id){var t=state.tasks.find(function(x){return x.id===id});var name=t?t.title:"esta tarea";if(!confirm('Eliminar permanentemente "'+name+'"?\n\nTambién se borrará su historial de realizaciones. Esta acción no se puede deshacer.'))return;try{await api("/api/tasks/"+id+"/hard",{method:"DELETE"});await load()}catch(e){alert(e.message)}}
async function addToday(id){try{var r=await api("/api/today/"+id,{method:"POST"});view="board";await load();if(r.undo_id)showUndo("Añadida a Hoy",r.undo_id)}catch(e){alert(e.message)}}
function completeTask(id){var t=state.tasks.find(function(x){return x.id===id});var html='<div class="modalhead"><div><h2>¿Quién la hizo?</h2><div class="muted">'+esc(t?t.title:"Tarea")+'</div></div><button class="ghost" onclick="closeModal()">×</button></div><div class="people">'+state.people.map(function(p){return '<button class="person" onclick="finish('+id+','+p.id+')"><span class="avatar" style="background:'+esc(p.color)+'">'+esc(p.icon)+'</span>'+esc(p.name)+'</button>'}).join("")+"</div>";showModal(html)}
async function finish(task,person){try{var p=state.people.find(function(x){return x.id===person});var r=await api("/api/tasks/"+task+"/complete",{method:"POST",body:JSON.stringify({person_id:person})});closeModal();await load();showUndo("Tarea completada"+(p?" por "+p.name:""),r.undo_id)}catch(e){alert(e.message)}}
function postpone(id){var tomorrow=new Date();tomorrow.setDate(tomorrow.getDate()+1);var d=tomorrow.toISOString().slice(0,10);var html='<div class="modalhead"><div><h2>Posponer</h2><div class="muted">Solo cambia esta aparición.</div></div><button class="ghost" onclick="closeModal()">×</button></div><div class="field"><label>Nueva fecha</label><input id="postdate" type="date" value="'+d+'"></div><div class="modalfoot"><button class="ghost" onclick="closeModal()">Cancelar</button><button class="primary" onclick="doPostpone('+id+')">Guardar</button></div>';showModal(html)}
async function doPostpone(id){var d=document.getElementById("postdate").value;try{var r=await api("/api/tasks/"+id+"/postpone",{method:"POST",body:JSON.stringify({due_date:d})});closeModal();await load();showUndo("Tarea pospuesta",r.undo_id)}catch(e){alert(e.message)}}
function bindBoardDrag(){if(window.matchMedia("(max-width:760px)").matches){document.querySelectorAll('.kanban [draggable="true"]').forEach(function(el){el.setAttribute("draggable","false")});return}document.querySelectorAll('.kanban [draggable="true"]').forEach(function(el){el.addEventListener("dragstart",function(e){if(dropBusy){e.preventDefault();return}dragged={id:Number(el.dataset.id),origin:el.dataset.origin};el.style.opacity=".45";if(e.dataTransfer){e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain",String(dragged.id))}});el.addEventListener("dragend",function(){el.style.opacity="";document.querySelectorAll(".kanban-col").forEach(function(x){x.classList.remove("hot")});if(!dropBusy)dragged=null});el.addEventListener("dragover",function(e){if(dragged&&dragged.origin==="today"&&el.dataset.origin==="today"){e.preventDefault();e.stopPropagation()}});el.addEventListener("drop",async function(e){if(dropBusy||!dragged||dragged.origin!=="today"||el.dataset.origin!=="today")return;e.preventDefault();e.stopPropagation();var target=Number(el.dataset.id);if(dragged.id===target)return;var ids=state.today.map(function(t){return t.id});var a=ids.indexOf(dragged.id),b=ids.indexOf(target);if(a<0||b<0)return;ids.splice(a,1);ids.splice(b,0,dragged.id);dropBusy=true;try{var r=await api("/api/today/reorder",{method:"POST",body:JSON.stringify({task_ids:ids})});dragged=null;await load();if(r.undo_id)showUndo("Orden de Hoy cambiado",r.undo_id)}catch(err){alert(err.message)}finally{dropBusy=false}})});document.querySelectorAll(".kanban-col").forEach(function(col){col.addEventListener("dragover",function(e){if(dropBusy||!dragged)return;var target=col.dataset.drop;if((target==="today"&&dragged.origin==="upcoming")||(target==="done"&&dragged.origin==="today")){e.preventDefault();col.classList.add("hot")}});col.addEventListener("dragleave",function(e){if(!col.contains(e.relatedTarget))col.classList.remove("hot")});col.addEventListener("drop",async function(e){if(dropBusy||!dragged)return;var target=col.dataset.drop;if(!((target==="today"&&dragged.origin==="upcoming")||(target==="done"&&dragged.origin==="today")))return;e.preventDefault();e.stopPropagation();col.classList.remove("hot");var item={id:dragged.id,origin:dragged.origin};dragged=null;dropBusy=true;try{if(target==="today"){var r=await api("/api/today/"+item.id,{method:"POST"});await load();if(r.undo_id)showUndo("Añadida a Hoy",r.undo_id)}else if(target==="done"){completeTask(item.id)}}catch(err){alert(err.message)}finally{dropBusy=false}})})}

function mobileColumnName(i){return ["Todas las tareas","Próximamente","Hoy","Realizadas"][i]||""}
function updateMobileBoardIndicator(){var label=document.getElementById("mobileBoardLabel"),pos=document.getElementById("mobileBoardPos");if(label)label.textContent=mobileColumnName(mobileBoardIndex);if(pos)pos.textContent=(mobileBoardIndex+1)+" / 4"}
function moveBoard(delta){var board=document.getElementById("kanbanBoard");if(!board)return;var cols=board.querySelectorAll(".kanban-col");mobileBoardIndex=Math.max(0,Math.min(cols.length-1,mobileBoardIndex+delta));var target=cols[mobileBoardIndex];board.scrollTo({left:target.offsetLeft,behavior:"smooth"});updateMobileBoardIndicator()}
function initMobileBoard(){if(!window.matchMedia("(max-width:760px)").matches)return;var board=document.getElementById("kanbanBoard");if(!board)return;var cols=board.querySelectorAll(".kanban-col");mobileBoardIndex=Math.max(0,Math.min(cols.length-1,mobileBoardIndex));requestAnimationFrame(function(){board.scrollLeft=cols[mobileBoardIndex].offsetLeft;updateMobileBoardIndicator()});board.addEventListener("scroll",function(){if(boardScrollRAF)cancelAnimationFrame(boardScrollRAF);boardScrollRAF=requestAnimationFrame(function(){var best=0,dist=Infinity;cols.forEach(function(col,i){var d=Math.abs(col.offsetLeft-board.scrollLeft);if(d<dist){dist=d;best=i}});if(best!==mobileBoardIndex){mobileBoardIndex=best;updateMobileBoardIndicator()}})},{passive:true})}

load();
</script>
