<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Casa Tareas</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#1e2a3a;--muted:#708097;--line:#dfe5ed;--primary:#246bfe;--green:#21a56b;--shadow:0 10px 30px rgba(30,48,77,.08)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}.app{max-width:1440px;margin:20px auto;background:rgba(255,255,255,.72);min-height:calc(100vh - 40px);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}
header{height:70px;display:flex;align-items:center;gap:18px;padding:0 24px;border-bottom:1px solid var(--line);background:#fff}.brand{font-weight:900;font-size:20px;margin-right:auto}.tabs{display:flex;height:100%}.tab{border:0;background:none;padding:0 16px;font-weight:750;color:#65758b;border-bottom:3px solid transparent;cursor:pointer}.tab.active{color:var(--primary);border-color:var(--primary)}
main{padding:28px}.pagehead{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:20px}h1{font-size:34px;margin:0}.subtitle{color:var(--muted);margin-top:5px}.primary,.secondary,.danger,.ghost{border:0;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer}.primary{background:var(--primary);color:#fff}.secondary{background:#eef4ff;color:#245fcf}.danger{background:#fff0f1;color:#ba3942}.ghost{background:#fff;border:1px solid var(--line);color:#4c5d74}
.grid{display:grid;gap:12px}.kanban{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;align-items:start}.kanban-col{background:#f8fafc;border:1px solid var(--line);border-radius:18px;padding:14px;min-height:520px;transition:.15s ease}.kanban-col.hot{border-color:var(--primary);box-shadow:0 0 0 3px rgba(36,107,254,.10);background:#f3f7ff}.kanban-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.kanban-title{font-size:18px;font-weight:950}.kanban-count{font-size:12px;font-weight:850;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 8px}.kanban-list{display:grid;gap:10px}.kanban .card{grid-template-columns:auto 1fr;padding:12px;cursor:grab}.kanban .card:active{cursor:grabbing}.kanban .actions{grid-column:1/-1;justify-content:flex-start}.kanban-empty{border:2px dashed #d6deea;border-radius:14px;padding:28px 12px;text-align:center;color:var(--muted);font-size:13px;background:rgba(255,255,255,.65)}.done-card{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:center;padding:11px;background:#fff;border:1px solid var(--line);border-radius:14px}.done-card .avatar{width:36px;height:36px;font-size:18px}.drag-hint{font-size:12px;color:var(--muted);margin-top:5px}.card{display:grid;grid-template-columns:auto 1fr auto;gap:13px;align-items:center;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 4px 14px rgba(30,48,77,.04);position:relative;overflow:hidden}.card:before{content:"";position:absolute;inset:0;background:var(--c,#eef4ff);opacity:.55;pointer-events:none}.card>*{position:relative}.icon{width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.72);display:grid;place-items:center;font-size:24px}.title{font-weight:900}.desc{font-size:14px;color:#596a81;margin-top:3px}.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}.pill{font-size:12px;font-weight:800;background:rgba(255,255,255,.75);padding:4px 8px;border-radius:999px;color:#53657d}.overdue{color:#b43b43}.actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.drop{margin-top:18px;border:2px dashed #a8bdd8;border-radius:18px;min-height:105px;display:grid;place-items:center;text-align:center;color:#63768f;background:rgba(255,255,255,.55);font-weight:800}.drop.hot{border-color:var(--green);background:#ebfaf3;color:#087b4d}.empty{text-align:center;padding:46px 20px;border:1px dashed #cfd8e5;border-radius:18px;color:var(--muted);background:#fff}
.section{font-size:17px;font-weight:900;margin:26px 0 10px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.search,.field input,.field textarea,.field select{border:1px solid #cfd8e5;border-radius:12px;padding:11px 12px;background:#fff;color:var(--text);outline:none}.search{flex:1;min-width:220px}
.modalback{position:fixed;inset:0;background:rgba(14,24,38,.38);backdrop-filter:blur(3px);z-index:50}.modal{position:fixed;z-index:60;left:50%;top:50%;transform:translate(-50%,-50%);width:min(94vw,560px);max-height:88vh;overflow:auto;background:#fff;border-radius:22px;box-shadow:0 30px 90px rgba(18,31,48,.28);padding:22px}.hidden{display:none!important}.modalhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:16px}.modal h2{margin:0}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:850;color:#506178}.modalfoot{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.people{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.person{border:1px solid var(--line);background:#fff;border-radius:16px;padding:16px 10px;display:grid;place-items:center;gap:7px;font-weight:900;cursor:pointer}.avatar{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:25px;border:3px solid #fff;box-shadow:0 2px 9px rgba(30,48,77,.12)}
.history{display:grid;gap:9px}.hist{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);padding:12px 14px;border-radius:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}.count{font-size:28px;font-weight:950}.muted{color:var(--muted);font-size:13px}.bottom{display:none}
@media(max-width:1180px){.kanban{grid-template-columns:repeat(4,minmax(300px,1fr));overflow-x:auto;padding-bottom:8px;scroll-snap-type:x proximity}.kanban-col{scroll-snap-align:start;min-height:430px}}@media(max-width:760px){body{background:#fff}.app{margin:0;min-height:100vh;border:0;border-radius:0;box-shadow:none;padding-bottom:72px}header{height:58px;padding:0 15px}.tabs{display:none}main{padding:18px 14px}h1{font-size:30px}.card{grid-template-columns:auto 1fr}.actions{grid-column:1/-1}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.people{grid-template-columns:repeat(3,1fr)}.stats{grid-template-columns:1fr}.bottom{display:grid;position:fixed;z-index:40;left:0;right:0;bottom:0;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}.bottom button{border:0;background:none;padding:9px 4px 8px;font-size:11px;font-weight:800;color:#66768b}.bottom button.active{color:var(--primary)}}
</style>
</head>
<body>
<div class="app">
<header><div class="brand">🏠 Casa Tareas</div><nav class="tabs"></nav><button class="primary" onclick="openTask()">+ Nueva tarea</button></header>
<main id="main"></main>
</div>
<nav class="bottom" id="bottom"></nav>
<div id="modalback" class="modalback hidden" onclick="closeModal()"></div>
<div id="modal" class="modal hidden"></div>
<script>
var state={people:[],today:[],upcoming:[],tasks:[],history:[],stats:[]};var view="board";var dragged=null;
var views=[["board","Tablero","▦"],["tasks","Tareas","☰"],["history","Historial","↺"]];
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"})[c]})}
async function api(url,opt){var r;try{r=await fetch(url,Object.assign({headers:{"Content-Type":"application/json"}},opt||{}))}catch(e){throw new Error("No se pudo conectar con la API en "+url+". Comprueba que el servidor sigue arrancado y mira la terminal donde ejecutaste uvicorn.")}var raw=await r.text();var x={};if(raw){try{x=JSON.parse(raw)}catch(e){x={detail:raw}}}if(!r.ok)throw new Error(x.detail||("Error HTTP "+r.status));return x}
async function load(){state=await api("/api/state");render()}
function fmtDate(s){if(!s)return"";var d=new Date(s.length===10?s+"T12:00:00":s);return new Intl.DateTimeFormat("es",{day:"numeric",month:"short"}).format(d)}
function dueText(t){if(!t.next_due)return"";var a=new Date(t.next_due+"T12:00:00"),b=new Date();b.setHours(12,0,0,0);var n=Math.round((a-b)/86400000);if(n<0)return Math.abs(n)+" d pendiente";if(n===0)return"Hoy";if(n===1)return"Mañana";return"En "+n+" días"}
function tabs(){var h="",b="";views.forEach(function(v){h+='<button class="tab '+(view===v[0]?"active":"")+'" onclick="go(\''+v[0]+'\')">'+v[1]+"</button>";b+='<button class="'+(view===v[0]?"active":"")+'" onclick="go(\''+v[0]+'\')"><div>'+v[2]+"</div>"+v[1]+"</button>"});document.querySelector(".tabs").innerHTML=h;document.getElementById("bottom").innerHTML=b}
function go(v){view=v;render()}
function render(){tabs();if(view==="board")renderBoard();if(view==="tasks")renderTasks();if(view==="history")renderHistory()}
function card(t,mode){var due=dueText(t);var buttons="";
if(mode==="today")buttons='<button class="ghost" onclick="postpone('+t.id+')">Posponer</button><button class="secondary" onclick="completeTask('+t.id+')">✓ Hecha</button>';
if(mode==="upcoming")buttons='<button class="secondary" onclick="addToday('+t.id+')">+ Hoy</button><button class="ghost" onclick="editTask('+t.id+')">Editar</button>';
if(mode==="tasks")buttons='<button class="ghost" onclick="editTask('+t.id+')">Editar</button>'+(t.active?'<button class="ghost" onclick="archiveTask('+t.id+')">Archivar</button>':'')+'<button class="danger" onclick="deleteTask('+t.id+')">Eliminar</button>';
return '<article class="card" style="--c:'+esc(t.color)+'" '+(mode==="today"?'draggable="true" data-id="'+t.id+'"':'')+'><div class="icon">'+esc(t.icon)+'</div><div><div class="title">'+esc(t.title)+'</div><div class="desc">'+esc(t.description)+'</div><div class="meta"><span class="pill">'+esc(t.category)+'</span>'+(due?'<span class="pill '+(due.indexOf("pendiente")>0?"overdue":"")+'">'+esc(due)+'</span>':"")+'</div></div><div class="actions">'+buttons+"</div></article>"}
function boardCard(t,origin){var due=dueText(t);var buttons=origin==="today"?'<button class="ghost" onclick="postpone('+t.id+')">Posponer</button><button class="secondary" onclick="completeTask('+t.id+')">✓ Hecha</button>':origin==="all"?'<button class="secondary" onclick="addToday('+t.id+')">+ Hoy</button><button class="ghost" onclick="editTask('+t.id+')">Editar</button>':'<button class="secondary" onclick="addToday('+t.id+')">+ Hoy</button>';return '<article class="card" style="--c:'+esc(t.color)+'" draggable="true" data-id="'+t.id+'" data-origin="'+origin+'"><div class="icon">'+esc(t.icon)+'</div><div><div class="title">'+esc(t.title)+'</div><div class="desc">'+esc(t.description)+'</div><div class="meta"><span class="pill">'+esc(t.category)+'</span>'+(due?'<span class="pill '+(due.indexOf("pendiente")>0?"overdue":"")+'">'+esc(due)+'</span>':"")+'</div></div><div class="actions">'+buttons+'</div></article>'}
function renderBoard(){var recent=state.history.slice(0,8);var all=state.tasks.filter(function(t){return t.active});var h='<div class="pagehead"><div><h1>Tablero</h1><div class="subtitle">Todas → Próximamente → Hoy → Realizadas. Arrastra las tarjetas para mover el trabajo.</div></div><button class="primary" onclick="openTask()">+ Nueva tarea</button></div><div class="kanban">';h+='<section class="kanban-col" id="col-all" data-drop="all"><div class="kanban-head"><div><div class="kanban-title">Todas las tareas</div><div class="drag-hint">Catálogo activo · arrastra cualquiera a Hoy</div></div><span class="kanban-count">'+all.length+'</span></div><div class="kanban-list">'+(all.length?all.map(function(t){return boardCard(t,"all")}).join(""):'<div class="kanban-empty">No hay tareas activas.</div>')+'</div></section>';h+='<section class="kanban-col" id="col-upcoming" data-drop="upcoming"><div class="kanban-head"><div><div class="kanban-title">Próximamente</div><div class="drag-hint">Arrastra a Hoy para adelantarla</div></div><span class="kanban-count">'+state.upcoming.length+'</span></div><div class="kanban-list">'+(state.upcoming.length?state.upcoming.map(function(t){return boardCard(t,"upcoming")}).join(""):'<div class="kanban-empty">No hay tareas futuras.</div>')+'</div></section>';h+='<section class="kanban-col" id="col-today" data-drop="today"><div class="kanban-head"><div><div class="kanban-title">Hoy</div><div class="drag-hint">Reordena o arrastra a Realizada</div></div><span class="kanban-count">'+state.today.length+'</span></div><div class="kanban-list">'+(state.today.length?state.today.map(function(t){return boardCard(t,"today")}).join(""):'<div class="kanban-empty">🎉 Nada pendiente para hoy.</div>')+'</div></section>';h+='<section class="kanban-col" id="col-done" data-drop="done"><div class="kanban-head"><div><div class="kanban-title">Realizadas</div><div class="drag-hint">Últimas tareas completadas</div></div><span class="kanban-count">'+recent.length+'</span></div><div class="kanban-list">'+(recent.length?recent.map(function(x){return '<div class="done-card"><div class="icon">'+esc(x.icon)+'</div><div><div class="title">'+esc(x.title)+'</div><div class="muted">'+new Date(x.completed_at).toLocaleString("es")+' · '+esc(x.name)+'</div></div><div class="avatar" style="background:'+esc(x.color)+'">'+esc(x.person_icon)+'</div></div>'}).join(""):'<div class="kanban-empty">Aún no hay tareas realizadas.</div>')+'</div></section></div>';document.getElementById("main").innerHTML=h;bindBoardDrag()}
function renderToday(){var h='<div class="pagehead"><div><h1>Hoy</h1><div class="subtitle">Una cola pequeña para lo que toca ahora.</div></div><button class="primary" onclick="openTask()">+ Añadir</button></div>';
h+=state.today.length?'<div class="grid">'+state.today.map(function(t){return card(t,"today")}).join("")+"</div>":'<div class="empty">🎉 No hay tareas en la cola de hoy.</div>';
h+='<div class="drop" id="done">Arrastra aquí una tarea terminada<br><span class="muted">o usa el botón ✓ Hecha</span></div>';document.getElementById("main").innerHTML=h;bindDrag()}
function renderUpcoming(){var h='<div class="pagehead"><div><h1>Próximamente</h1><div class="subtitle">Lo que viene después, ordenado por fecha.</div></div></div>';if(!state.upcoming.length)h+='<div class="empty">No hay tareas futuras.</div>';else{var groups={};state.upcoming.forEach(function(t){var k=t.next_due||"Sin fecha";(groups[k]||(groups[k]=[])).push(t)});Object.keys(groups).forEach(function(k){h+='<div class="section">'+fmtDate(k)+'</div><div class="grid">'+groups[k].map(function(t){return card(t,"upcoming")}).join("")+"</div>"})}document.getElementById("main").innerHTML=h}
function renderTasks(){var active=state.tasks.filter(function(t){return t.active});var archived=state.tasks.filter(function(t){return !t.active});var h='<div class="pagehead"><div><h1>Tareas</h1><div class="subtitle">Catálogo maestro de tareas domésticas.</div></div><button class="primary" onclick="openTask()">+ Nueva tarea</button></div><div class="toolbar"><input class="search" id="q" placeholder="Buscar..." oninput="filterTasks()"></div><div id="tasklist">';
h+='<div class="section">Activas · '+active.length+'</div><div class="grid">'+active.map(function(t){return card(t,"tasks")}).join("")+"</div>";if(archived.length)h+='<div class="section">Archivadas · '+archived.length+'</div><div class="grid">'+archived.map(function(t){return card(t,"tasks")}).join("")+"</div>";h+="</div>";document.getElementById("main").innerHTML=h}
function filterTasks(){var q=document.getElementById("q").value.toLowerCase();document.querySelectorAll("#tasklist .card").forEach(function(el){el.style.display=el.innerText.toLowerCase().indexOf(q)>=0?"":"none"})}
function renderHistory(){var h='<div class="pagehead"><div><h1>Historial</h1><div class="subtitle">Realizaciones y reparto de los últimos 30 días.</div></div></div><div class="stats">'+state.stats.map(function(s){return '<div class="stat"><div class="avatar" style="background:'+esc(s.color)+'">'+esc(s.icon)+'</div><div class="count">'+s.count+'</div><div>'+esc(s.name)+'</div><div class="muted">tareas · 30 días</div></div>'}).join("")+"</div>";h+='<div class="history">'+(state.history.length?state.history.map(function(x){return '<div class="hist"><div class="icon">'+esc(x.icon)+'</div><div><div class="title">'+esc(x.title)+'</div><div class="muted">'+new Date(x.completed_at).toLocaleString("es")+'</div></div><div class="avatar" style="background:'+esc(x.color)+'">'+esc(x.person_icon)+'</div></div>'}).join(""):'<div class="empty">Todavía no hay realizaciones.</div>')+"</div>";document.getElementById("main").innerHTML=h}
function showModal(html){document.getElementById("modal").innerHTML=html;document.getElementById("modal").classList.remove("hidden");document.getElementById("modalback").classList.remove("hidden")}
function closeModal(){document.getElementById("modal").classList.add("hidden");document.getElementById("modalback").classList.add("hidden")}
function openTask(id){var t=id?state.tasks.find(function(x){return x.id===id}):null;var due=t&&t.initial_due_date?t.initial_due_date:new Date().toISOString().slice(0,10);var html='<div class="modalhead"><div><h2>'+(t?"Editar tarea":"Nueva tarea")+'</h2><div class="muted">Título, descripción y recurrencia.</div></div><button class="ghost" onclick="closeModal()">×</button></div><form id="taskform" class="formgrid"><div class="field full"><label>Título</label><input name="title" required value="'+esc(t?t.title:"")+'"></div><div class="field full"><label>Descripción</label><textarea name="description">'+esc(t?t.description:"")+'</textarea></div><div class="field"><label>Categoría</label><input name="category" value="'+esc(t?t.category:"General")+'"></div><div class="field"><label>Icono</label><input name="icon" value="'+esc(t?t.icon:"🧹")+'"></div><div class="field"><label>Color</label><input name="color" type="color" value="'+esc(t?t.color:"#dcecff")+'"></div><div class="field"><label>Tipo</label><select name="recurrence_type"><option value="none">Puntual</option><option value="cycle">Cada X días desde última vez</option><option value="fixed">Calendario fijo</option></select></div><div class="field"><label>Cada X días</label><input name="frequency_days" type="number" min="1" value="'+esc(t&&t.frequency_days?t.frequency_days:"7")+'"></div><div class="field"><label>Primera / próxima fecha</label><input name="initial_due_date" type="date" value="'+esc(due)+'"></div><div class="field full"><label>Fecha de anclaje</label><input name="anchor_date" type="date" value="'+esc(t&&t.anchor_date?t.anchor_date:due)+'"></div></form><div class="modalfoot"><button class="ghost" onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveTask('+(t?t.id:"null")+')">Guardar</button></div>';showModal(html);document.querySelector('[name="recurrence_type"]').value=t?t.recurrence_type:"cycle"}
function editTask(id){openTask(id)}
async function saveTask(id){var f=new FormData(document.getElementById("taskform"));var o=Object.fromEntries(f.entries());o.frequency_days=o.recurrence_type==="none"?null:Number(o.frequency_days||7);try{await api(id?"/api/tasks/"+id:"/api/tasks",{method:id?"PUT":"POST",body:JSON.stringify(o)});closeModal();await load()}catch(e){alert(e.message)}}
async function archiveTask(id){if(!confirm("¿Archivar esta tarea? El historial se conservará."))return;await api("/api/tasks/"+id,{method:"DELETE"});load()}
async function deleteTask(id){var t=state.tasks.find(function(x){return x.id===id});var name=t?t.title:"esta tarea";if(!confirm('Eliminar permanentemente "'+name+'"?\n\nTambién se borrará su historial de realizaciones. Esta acción no se puede deshacer.'))return;try{await api("/api/tasks/"+id+"/hard",{method:"DELETE"});await load()}catch(e){alert(e.message)}}
async function addToday(id){await api("/api/today/"+id,{method:"POST"});view="board";load()}
function completeTask(id){var t=state.tasks.find(function(x){return x.id===id});var html='<div class="modalhead"><div><h2>¿Quién la hizo?</h2><div class="muted">'+esc(t?t.title:"Tarea")+'</div></div><button class="ghost" onclick="closeModal()">×</button></div><div class="people">'+state.people.map(function(p){return '<button class="person" onclick="finish('+id+','+p.id+')"><span class="avatar" style="background:'+esc(p.color)+'">'+esc(p.icon)+'</span>'+esc(p.name)+'</button>'}).join("")+"</div>";showModal(html)}
async function finish(task,person){await api("/api/tasks/"+task+"/complete",{method:"POST",body:JSON.stringify({person_id:person})});closeModal();load()}
function postpone(id){var tomorrow=new Date();tomorrow.setDate(tomorrow.getDate()+1);var d=tomorrow.toISOString().slice(0,10);var html='<div class="modalhead"><div><h2>Posponer</h2><div class="muted">Solo cambia esta aparición.</div></div><button class="ghost" onclick="closeModal()">×</button></div><div class="field"><label>Nueva fecha</label><input id="postdate" type="date" value="'+d+'"></div><div class="modalfoot"><button class="ghost" onclick="closeModal()">Cancelar</button><button class="primary" onclick="doPostpone('+id+')">Guardar</button></div>';showModal(html)}
async function doPostpone(id){var d=document.getElementById("postdate").value;await api("/api/tasks/"+id+"/postpone",{method:"POST",body:JSON.stringify({due_date:d})});closeModal();load()}

d.id;dragged=null;completeTask(id2)}})})}
